aid: unlearnai
name: Unlearn.AI
description: 'Unlearn.AI provides an AI-powered platform that streamlines clinical trial development
  using digital twins of patients and advanced data analytics. Its TrialPioneer workspace spans trial
  planning and simulation (Scout literature search, Hindsight data exploration, SimLab scenario modeling),
  advanced trial monitoring with anomaly detection, and digital-twin control-arm forecasting that reduces
  control arm sizes and shortens enrollment. Backed by Insight Partners; no public developer API surface
  is published.'
